   ================================================== */
#include <stdio.h>
#include <conio.h>
#define max 5
static int stack[max];
int top = -1;
void push(int x)
{
stack[++top] = x;
}
int pop()
{
return (stack[top--]);
}
void view()
{
int i;
if (top < 0)
printf("\n Stack Empty \n");
else
{
printf("\n Top-->");
for(i=top; i>=0; i--)
{
printf("%4d", stack[i]);
}
printf("\n");
}
}
main()
{
int ch=0, val;
clrscr();
while(ch != 4)
{
printf("\n STACK OPERATION \n");
printf("1.PUSH ");
printf("2.POP ");
printf("3.VIEW ");
printf("4.QUIT \n");
printf("Enter Choice : ");
scanf("%d", &ch);
switch(ch)
{
case 1:
if(top < max-1)
{
printf("\nEnter Stack element : ");
scanf("%d", &val);
push(val);
}
else
printf("\n Stack Overflow \n");
break;
case 2:
if(top < 0)
printf("\n Stack Underflow \n");
else
{
val = pop();
printf("\n Popped element is %d\n", val);
}
break;
case 3:
view();
break;
case 4:
exit(0);
default:
printf("\n Invalid Choice \n");
}
}
}

#include <stdio.h>
#include <conio.h>
#define max 5
static int queue[max];
int front = -1;
int rear = -1;
void insert(int x)
{
queue[++rear] = x;
if (front == -1)
front = 0;
}
int remove()
{
int val;
val = queue[front];
if (front==rear && rear==max-1)
front = rear = -1;
else
front ++;
return (val);
}
void view()
{
int i;
if (front == -1)
printf("\n Queue Empty \n");
else
{
printf("\n Front-->");
for(i=front; i<=rear; i++)

}
}

/* ==================================================
   EX.NO: 1(C)
   ARRAY IMPLEMENTATION OF CIRCULAR QUEUE
   ================================================== */
#include <stdio.h>
#include <Windows.h>
#define MAX_SIZE 5
int a[MAX_SIZE];
int front = -1;
int rear = -1;
void enqueue(int x)
{
if (front == -1 && rear == -1)
{
front = rear = 0;
}
else if ((rear + 1) % MAX_SIZE == front)
{
printf("queue is full\n");
return;
}
else
rear = (rear + 1) % MAX_SIZE;
a[rear] = x;
}
void dequeue()
{
if (front == -1 && rear == -1)
{
printf("queue is empty \n");
return;
}
else if (front == rear)
{
front = rear = -1;
}
else
front = (front + 1) % MAX_SIZE;
}
int Peek()
{
if (a[front] == -1)
return -1;
return a[front];
}
void Print()
{
int count = ((rear + MAX_SIZE - front) % MAX_SIZE)+1;
int i;
for (i = 0; i < count; i++)
{
printf("%d ", a[(front+i)%MAX_SIZE]);
}
printf("\n");
}
int main(void)
{
enqueue(5);
printf("\nFirst insertion in circular Queue\n");
Print();
printf("\n Second insertion in circular Queue\n");
enqueue(7);
Print();
printf("\n Third insertion in circular Queue\n");
enqueue(-3);
Print();
printf("\n Fourth insertion in circular Queue\n");
enqueue(9);
Print();
printf("\n Circular Queue after first deletion\n");
dequeue();
Print();
printf("\n Circular Queue after 2nd deletion\n");
dequeue();
Print();
printf("\n Insertion in circular Queue\n");
enqueue(14);
system("pause");
return 0;
}

/* ==================================================
   EX.NO: 5(a)
   INFIX TO POSTFIX CONVERSION
   ================================================== */
#include <stdio.h>
#include <conio.h>
#include <string.h>
#define MAX 20
int top = -1;
char stack[MAX];
char pop();
void push(char item);
int prcd(char symbol)
{
switch(symbol)
{
case '+':
case '-':
return 2;
break;
case '*':
case '/':
return 4;
break;
case '^':
case '$':
return 6;
break;
case '(':
case ')':
case '#':
return 1;
break;
}
}
int isoperator(char symbol)
{
switch(symbol)
{
case '+':
case '-':
case '*':
case '/':
case '^':
case '$':
case '(':
case ')':
return 1;
break;
default:
return 0;
}
}
void convertip(char infix[],char postfix[])
{
int i,symbol,j = 0;
stack[++top] = '#';
for(i=0;i<strlen(infix);i++)
{
symbol = infix[i];
if(isoperator(symbol) == 0)
{
postfix[j] = symbol;
j++;
}
else
{
if(symbol == '(')
push(symbol);
else if(symbol == ')')
{
while(stack[top] != '(')
{
postfix[j] = pop();
j++;
}
pop(); //pop out (.
}
else
{
if(prcd(symbol) > prcd(stack[top]))
push(symbol);
else
{
while(prcd(symbol) <= prcd(stack[top]))
{
postfix[j] = pop();
j++;
}
push(symbol);
}
}
}
}
while(stack[top] != '#')
{
postfix[j] = pop();
j++;
}
postfix[j] = '\0';
}
main()
{
char infix[20],postfix[20];
clrscr();
printf("Enter the valid infix string: ");
gets(infix);
convertip(infix, postfix);
printf("The corresponding postfix string is: ");
puts(postfix);
getch();
}
void push(char item)
{
top++;
stack[top] = item;
}
char pop()
{
char a;
a = stack[top];
top--;
return a;
}

// structure of a node

struct node *create_node(int);
void insert(int);

void inorder(struct node *);

// creates a new node
struct node *create_node(int data)
{
struct node *new_node = (struct node *)malloc(sizeof(struct node));
if (new_node == NULL)
{
printf("\nMemory for new node can't be allocated");
return NULL;
}
new_node->data = data;
new_node->left = NULL;
new_node->right = NULL;
return new_node;
}
// inserts the data in the BST
void insert(int data)
{
struct node *new_node = create_node(data);
if (new_node != NULL)
{
// if the root is empty then make a new node as the root node
if (root == NULL)
{
root = new_node;
printf("\n* node having data %d was inserted\n", data);
return;
}
struct node *temp = root;
struct node *prev = NULL;
// traverse through the BST to get the correct position for insertion
while (temp != NULL)
{
prev = temp;
if (data > temp->data)
{
temp = temp->right;
}
else
{
temp = temp->left;
}
}
// found the last node where the new node should insert
if (data > prev->data)
{
prev->right = new_node;
}
else
{
prev->left = new_node;
}
printf("\n* node having data %d was inserted\n", data);
}
}
// deletes the given key node from the BST
struct node *delete (struct node *root, int key)
{
if (root == NULL)
{
return root;
}
if (key < root->data)
{
root->left = delete (root->left, key);
}
else if (key > root->data)
{
root->right = delete (root->right, key);
}
else
{
if (root->left == NULL)
{
struct node *temp = root->right;
free(root);
return temp;
}
else if (root->right == NULL)
{
struct node *temp = root->left;
free(root);
return temp;
}
struct node *temp = smallest_node(root->right);
root->data = temp->data;
root->right = delete (root->right, temp->data);
}
return root;
}
// search the given key node in BST
int search(int key)
{
struct node *temp = root;
while (temp != NULL)
{
if (key == temp->data)
{
return 1;
}
else if (key > temp->data)
{
temp = temp->right;
}
else
{
temp = temp->left;
}
}
return 0;
}
// finds the node with the smallest value in BST

node * insert(node *T,int x)
{
      if(T==NULL)
      {
             T=(node *)malloc(sizeof(node));
             T->data=x;
             T->left=NULL;
             T->right=NULL;
      }
      else
             if(x > T->data)
             {
                   // insert in right subtree
                   T->right=insert(T->right,x);
                   if(BF(T) ==-2)
                          if(x>T->right->data)
                                   T=RR(T);
                          else
                                   T=RL(T);
             }
             else
                    if(x<T->data)
                    {
                           T->left=insert(T->left,x);
                           if(BF(T)==2)
                                  if(x < T->left->data)
                                         T=LL(T);
                                  else
                                         T=LR(T);
                    }
      T->ht=height(T);
      return(T);
}
node * Delete(node *T,int x)
{
      node *p;
      if(T==NULL)
      {
             return NULL;
      }
      else
             if(x > T->data)
             {
                    // insert in right subtree
                    T->right-Delete(T->right,x);
                    if(BF(T)==2)
                           if(BF(T->left)>=0)
                     T=LL(T);
              else
                     T=LR(T);
}
else
       if(x<T->data)
       {
              T->left-Delete(T->left,x);
              if(BF(T) ==-2) //Rebalance during windup
                     if(BF(T->right)<=0)
                            T=RR(T);
                     else
                            T=RL(T);
       }
       else
       {
              //data to be deleted is found
              if(T->right!=NULL)
              {
                     //delete its inorder succesor
                     p=T->right;
                     while(p->left!= NULL)
                            p=p->left;
                     T->data=p->data;
                     T->right-Delete(T->right,p->data);
                     if(BF(T)==2)
                            //Rebalance during windup
                                        if(BF(T->left)>=0)
                                               T=LL(T);
                                        else
                                               T=LR(T);
                           }
                           else
                                  return(T->left);
                     }
      T->ht=height (T);
      return(T);
}
int height(node *T)
{
      int lh,rh;
      if(T==NULL)
             return(0);
      if(T->left==NULL)
             lh=0;
      else
             lh=1+T->left->ht;
      if(T->right==NULL)
             rh=0;
      else
             rh=1+T->right->ht;
      if(lh>rh)
             return(lh);
      return(rh);
}
node* rotateright(node *x)
{
      node *y;
      y=x->left;
      x->left=y->right;
      y->right-x;
      x->ht=height(x);
      y->ht=height(y);
      return(y);
}
node * rotateleft(node *x)
{
      node *y;
      y=x->right;
      x->right=y->left;
      y->left=x;
      x->ht=height(x);
      y->ht=height(y);
      return(y);
}
node *RR(node *T)
{
      T=rotateleft(T);
      return(T);
}
node *LL(node *T)
{
     T= rotateright(T);
     return(T);
}
node *LR(node *T)
{
     T->left=rotateleft(T->left);
     T=rotateright(T);
     return(T);
}
node * RL(node *T)
{
     T->right=rotateright(T->right);
     T=rotateleft(T);
     return(T);
}
int BF(node *T)
{
     int lh,rh;
     if(T==NULL)
            return(0);
     if(T->left==NULL)
            lh=0;
     else
            lh=1+T->left->ht;
     if(T->right==NULL)
            rh=0;
      else
             rh=1+T->right->ht;
      return(lh-rh);
}
void preorder(node *T)
{
      if(T!=NULL)
      {
             printf("%d(Bf-%d)",T->data,BF(T));
             preorder(T->left);
             preorder(T->right);
      }
}
void inorder(node *T)
{
      if(T!=NULL)
      {
             inorder(T->left);
             printf("%d(Bf=%d)",T->data,BF(T));
             inorder(T->right);
      }
}

void dijikstra(int G[MAX][MAX], int n, int startnode)
{
      int cost[MAX][MAX], distance[MAX], pred[MAX];
      int visited[MAX], count, mindistance, nextnode, i,j;
      for(i=0;i < n;i++)
              for(j=0;j < n;j++)
             if(G[i][j]==0)
                      cost[i][j]=INFINITY;
             else
                      cost[i][j]=G[i][j];


for(i=0;i< n;i++)
{
      distance[i]=cost[startnode][i];
      pred[i]=startnode;
      visited[i]=0;
}
distance[startnode]=0;
visited[startnode]=1;
count=1;
while(count < n-1){
      mindistance=INFINITY;
      for(i=0;i < n;i++)
             if(distance[i] < mindistance&&!visited[i])
             {
                      mindistance=distance[i];
                      nextnode=i;
             }
      visited[nextnode]=1;
      for(i=0;i < n;i++)
             if(!visited[i])
                      if(mindistance+cost[nextnode][i] < distance[i])
                      {
                               distance[i]=mindistance+cost[nextnode][i];
                               pred[i]=nextnode;
                         }
                 count++;
    }


    for(i=0;i < n;i++)

                 j=i;
                 do
                 {
                         j=pred[j];
                         printf(" <-%d", j);
                 }
                 while(j!=startnode);
          }
}

    for (i = 0 ; i < size;i++)

        for (j = i ; j < size; j++)

      while(j<=j2)
